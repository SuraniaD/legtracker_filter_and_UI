# Alembic config for the LegTracker `tracker` schema.
# Manages ONLY objects in the `tracker` schema of the new database.
# The ingestion project's tables in `public` (and its own alembic_version)
# are never touched.
#
# Usage (from this directory):
#   export DATABASE_URL=postgresql://user:pass@host:5432/dbname
#   alembic upgrade head
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
